<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario InventorySoft</title>
    <link rel="stylesheet" href="css/inventorysoft.css">
</head>
<body>

    <div class="container">
    <h2>Formulario para el reporte de errores</h2>

    <form action="" method="get" class="form-container" id="reporteForm">
        <div class="form-group">
        <label for="nombre">Nombre de la empresa</label>
        <input type="text" id="nombre" placeholder="Ingrese el nombre" required minlength="3" maxlength="25">
        </div>

        

    <div class="form-group">
        <label for="NIT">NIT</label>
        <input type="number"  id="nit" placeholder="Ingrese el NIT" required min="1" max="999999999"> 
    </div>
    

    <div class="form-group">
        <label for="direccion">Direccion</label>
        <input type="text"  id="direccion" placeholder="Ingrese la direccion" required>
    </div>

    <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" placeholder="Ingrese su correo electrónico" pattern="[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" required>
    </div>

         <div class="form-group">
         <label for="tipo">Tipo de problema</label>
        <select id="tipo" required>
            <option value="">Seleccione el tipo de problema</option>
            <option value="crasheos">Crasheos</option>
            <option value="datos">Registro de informacion</option>
            <option value ="visual">Errores visuales</option>
            <option value="otros">Otros</option>
        </select>
    </div>

    




<div id="otroTipoContainer" class="form-group full-width oculto">
  <label for="otroTipo">Especifique el tipo de problema</label>
  <input type="text" id="otroTipo" placeholder="Escriba el tipo de problema">
</div>
    

    <div class="form-group full-width">
    <label for="descripcion">Descripcion</label>
    <textarea id="descripcion" placeholder="Describa el problema que presenta InventorySoft" required></textarea>

    </div>

    <div class="form-group full-width">
        <label for="imagen">Imagen del error</label>
        <input type="file" id="imagen" accept="image/*" required>
        <img class="preview-img" id="previewImg" alt="Vista previa">
    </div>

    <div class="button-container">
        <button id="btnAgregar" type="submit">Reportar</button>



    </div>
    </form>
</div>

<script src="js/inventorysoft.js"></script>
    
    
</body>
</html>
